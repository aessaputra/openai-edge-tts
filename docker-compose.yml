services:
  app:
    container_name: openai-edge-tts
    restart: unless-stopped
    build:
      context: .
      args:
        INSTALL_FFMPEG: ${INSTALL_FFMPEG_ARG:-false} # Controlled by env var or defaults to false
    ports:
      - '${PORT:-5050}:5050'
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,os;urllib.request.urlopen('http://127.0.0.1:%s/health' % os.getenv('PORT','5050'),timeout=4)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    environment: # optionally define in -e argument when running docker command
      API_KEY: ${API_KEY:-your_api_key_here}
      PORT: ${PORT:-5050}
      DEFAULT_VOICE: ${DEFAULT_VOICE:-id-ID-ArdiNeural}
      DEFAULT_RESPONSE_FORMAT: ${DEFAULT_RESPONSE_FORMAT:-mp3}
      DEFAULT_SPEED: ${DEFAULT_SPEED:-1.0}
      DEFAULT_LANGUAGE: ${DEFAULT_LANGUAGE:-id-ID}
      REQUIRE_API_KEY: ${REQUIRE_API_KEY:-True}
